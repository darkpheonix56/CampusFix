
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFix | Welcome</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --accent: #5865f2;
            --text: #202945;
            --muted: #7d88a5;
            --surface: #ffffff;
            --field: #f5f7ff;
            --border: #e5e9f5;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 80px 18px 30px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at 10% 10%, #dce3ff, transparent 40%),
                radial-gradient(ellipse at 90% 90%, #e8dcff, transparent 40%),
                #f5f7fd;
            transition: background .3s, color .3s;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 42px;
            border: 1px solid rgba(255,255,255,.9);
            border-radius: 26px;
            background: rgba(255,255,255,.9);
            box-shadow: 0 28px 80px rgba(55,69,130,.13);
            animation: appear .5s ease-out;
            backdrop-filter: blur(18px);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .brand-icon {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6878ff, #8556e8);
            color: white;
            font-size: 20px;
            letter-spacing: 0;
        }

        .eyebrow {
            margin: 30px 0 8px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 750;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 5vw, 36px);
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .subtitle {
            margin: 0 0 30px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        label {
            display: block;
            margin-bottom: 18px;
            font-size: 13px;
            font-weight: 650;
        }

        input {
            display: block;
            width: 100%;
            margin-top: 9px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--field);
            color: var(--text);
            font: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(88,101,242,.12);
        }

        input::placeholder {
            color: #a0a9bf;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }

        .primary-button {
            min-height: 48px;
            padding: 13px;
            border: 1px solid var(--accent);
            border-radius: 12px;
            background: linear-gradient(135deg, #6574ff, #5058e8);
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(88,101,242,.18);
            transition: transform .2s, box-shadow .2s;
        }

        .primary-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(88,101,242,.25);
        }

        #authMessage {
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        [hidden] {
            display: none !important;
        }

        /* Premium horizontal theme switch */

        .theme-switch {
            position: fixed;
            top: 24px;
            right: 25px;
            z-index: 10;
            width: 82px;
            height: 42px;
            padding: 5px;
            border: 1px solid #dce2f2;
            border-radius: 999px;
            background: #e8edff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(48,61,110,.12);
            transition: background .3s, border-color .3s;
        }

        .switch-icon {
            z-index: 1;
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            font-size: 17px;
        }

        .sun {
            color: #d18a00;
        }

        .moon {
            color: #6876a0;
        }

        .switch-thumb {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 2px 8px rgba(30,40,80,.2);
            transition: transform .3s cubic-bezier(.2,.8,.2,1);
        }

        .theme-switch:hover {
            border-color: #aebaff;
        }

        .theme-switch:focus-visible {
            outline: 3px solid rgba(88,101,242,.35);
            outline-offset: 3px;
        }

        body.dark {
            --text: #f0f2ff;
            --muted: #a7b1ca;
            --surface: #1b2234;
            --field: #151c2c;
            --border: #343e55;
            background:
                radial-gradient(ellipse at 10% 10%, #222b58, transparent 42%),
                radial-gradient(ellipse at 90% 90%, #302047, transparent 42%),
                #0d1220;
        }

        body.dark .login-card {
            background: rgba(27,34,52,.95);
            border-color: #30394e;
            box-shadow: 0 28px 80px rgba(0,0,0,.25);
        }

        body.dark input {
            background: var(--field);
            color: var(--text);
        }

        body.dark .theme-switch {
            background: #252d43;
            border-color: #3c4762;
        }

        body.dark .switch-thumb {
            transform: translateX(40px);
        }

        body.dark .sun {
            color: #8490b3;
        }

        body.dark .moon {
            color: #c5ccff;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
                border-radius: 22px;
            }

            .theme-switch {
                top: 18px;
                right: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <button
        class="theme-switch"
        id="themeButton"
        type="button"
        role="switch"
        aria-label="Toggle dark mode"
        aria-checked="false"
    >
        <span class="switch-icon sun">☀</span>
        <span class="switch-thumb"></span>
        <span class="switch-icon moon">☾</span>
    </button>

    <main class="login-card">
        <div class="brand">
            <span class="brand-icon">C</span>
            CAMPUSFIX
        </div>

        <p class="eyebrow">Your campus, your voice</p>
        <h1>Welcome back! 👋</h1>

        <p class="subtitle">
            Report campus problems, track their progress,
            and help make your campus a better place.
        </p>

        <section id="authSection">
            <form id="authForm">
                <label id="nameLabel">
                    Full name
                    <input
                        id="authName"
                        type="text"
                        placeholder="Enter your full name"
                        autocomplete="name"
                    >
                </label>

                <label>
                    Email address
                    <input
                        id="authEmail"
                        type="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </label>

                <label>
                    Password
                    <input
                        id="authPassword"
                        type="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        autocomplete="current-password"
                        required
                    >
                </label>

                <div class="actions">
                    <button
                        type="button"
                        id="signupButton"
                        class="primary-button"
                    >
                        Create account
                    </button>

                    <button
                        type="button"
                        id="loginButton"
                        class="primary-button"
                    >
                        Log in →
                    </button>
                </div>

                <p id="authMessage" aria-live="polite"></p>
            </form>

            <button
                type="button"
                id="logoutButton"
                class="primary-button"
                hidden
            >
                Log out
            </button>
        </section>
    </main>

    <script>
        const themeButton = document.getElementById("themeButton");

        if (localStorage.getItem("campusfix-theme") === "dark") {
            document.body.classList.add("dark");
        }

        function updateThemeButton() {
            themeButton.setAttribute(
                "aria-checked",
                document.body.classList.contains("dark") ? "true" : "false"
            );
        }

        updateThemeButton();

        themeButton.addEventListener("click", () => {
            document.body.classList.toggle("dark");

            localStorage.setItem(
                "campusfix-theme",
                document.body.classList.contains("dark")
                    ? "dark"
                    : "light"
            );

            updateThemeButton();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
</body>
</html>
